<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="scripts/appointment-scheduler.js" defer></script>
  <link rel="stylesheet" href="styles/style.css">
  <title>Document</title>
</head>

<body>
  <div id="main">
    <h1>Appoinment Scheduler</h1>
    <form id="scheduler-form" action="/submit" method="POST">
        
        <h2>Book An Appointment</h2>
      <div class="field-container">
        <label for="firstName">First Name:</label>
        <input type="text" id="fname" name="fname">
        <span class="error" id="error-fname">First name is required</span>
      </div>

      <label for="lastName">Last Name:</label>
      <input type="text" id="lname" name="lname">
      <span class="error" id="error-lname">Last name is required</span>

        <label for="date">Meeting Date:</label>
        <input type="date" id="date" name="date">

        <label for="time">Meeting Time:</label>
        <input type="time" id="time" name="time">

      <button type="submit">Book Appoinment</button>
    </form>
  </div>

</body>

</html>
